name: End-to-end Test for Study App

on:
  workflow_run:
    workflows: [Build and Push Docker Images]
    types:
      - completed

jobs:
  e2e-test-study-app:
    name: Launch end-to-end test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kubernetes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Run tests
        run: |
          uv run e2e_test.py

